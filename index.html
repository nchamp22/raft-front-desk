<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFT · Front desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__raftSupabaseLoadError=true"></script>
<style>
:root{--ink:#233b37;--muted:#6f807b;--paper:#f5f6f2;--white:#fff;--line:#e2e8e2;--green:#23584e;--mint:#e4f0e9;--orange:#c66f4d;--shadow:0 14px 40px #243a3310}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#eef3ed}.login-art{padding:9vh 8vw;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(ellipse at 75% 23%,#dce9dc 0 12%,transparent 12.2%),linear-gradient(140deg,#e6efe7,#f3f3ec 65%)}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.02em}.mark{width:42px;height:42px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-size:19px}.login-art h1{font:500 clamp(38px,4vw,58px)/1.06 Georgia,serif;max-width:530px;letter-spacing:-.04em}.login-art p{color:var(--muted);max-width:390px}.login-card-wrap{display:grid;place-items:center;padding:30px}.login-card{background:white;border:1px solid var(--line);border-radius:20px;padding:42px;width:min(440px,100%);box-shadow:var(--shadow)}.login-card h2{font:500 32px Georgia;margin:0 0 7px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:650;margin:17px 0 6px}input,select,textarea{width:100%;border:1px solid #dce4de;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#5d8c7c;box-shadow:0 0 0 3px #23584e17}textarea{min-height:96px;resize:vertical}.btn{border:0;background:var(--green);color:white;padding:11px 16px;border-radius:9px;font-weight:650}.btn:hover{background:#19473e}.btn.ghost{background:#f0f4f0;color:var(--ink)}.btn.small{padding:7px 11px;font-size:13px}.login-card .btn{width:100%;margin-top:21px}.error{color:#a3392b;background:#fff0ec;padding:10px;border-radius:8px;margin-top:14px;font-size:13px}.app{min-height:100vh}.top{height:74px;padding:0 max(28px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.top .brand{font-size:15px}.topright{display:flex;align-items:center;gap:16px}.badge{font-size:12px;background:var(--mint);padding:6px 10px;border-radius:99px;color:#27594c;font-weight:700}.shell{max-width:1180px;margin:auto;padding:35px 28px 70px}.nav{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:30px}.nav button{border:0;background:transparent;padding:11px 15px;color:#6b7c76;font-weight:650;border-bottom:2px solid transparent}.nav button.active{color:var(--green);border-color:var(--green)}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:#71837b;font-size:11px;font-weight:750}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px}.heading h1{font:500 40px/1.15 Georgia,serif;margin:6px 0 4px;letter-spacing:-.03em}.heading p{margin:0;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin:22px 0}.stat .value{font:500 33px Georgia;margin:8px 0 2px}.stat .caption{font-size:12px;color:var(--muted)}.home-grid{grid-template-columns:1.2fr .8fr}.section-title{font:500 22px Georgia;margin:0 0 14px}.action-list{display:grid;gap:10px}.action{border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;justify-content:space-between;align-items:center;background:white;text-align:left;color:var(--ink)}.action:hover{border-color:#9bb9aa;background:#fbfdfb}.action b{display:block}.action small{color:var(--muted)}.arrow{color:var(--green);font-size:20px}.row{display:flex;gap:12px;align-items:end}.row>*{flex:1}.searchbar{max-width:560px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#798980;padding:11px 10px;border-bottom:1px solid var(--line)}.table td{padding:13px 10px;border-bottom:1px solid #eef1ed;vertical-align:top}.table tr:last-child td{border-bottom:0}.person-name{font-weight:700}.pill{background:#f0f4f0;padding:4px 8px;border-radius:99px;font-size:12px;display:inline-block}.detail-grid{grid-template-columns:1fr 1fr;margin-top:16px}.detail-line{padding:8px 0;border-bottom:1px solid #eff2ee}.detail-line span{color:var(--muted);display:inline-block;min-width:105px}.empty{color:var(--muted);padding:18px 0}.form-grid{grid-template-columns:1fr 1fr}.form-grid .wide{grid-column:1/-1}.record-picker{display:flex;gap:9px;margin-bottom:18px}.notice{padding:13px 15px;border-radius:10px;background:#f2f6f2;color:#536b60;font-size:13px;margin:16px 0}.footer-note{font-size:12px;color:var(--muted);margin-top:12px}.results{margin-top:15px}.toast{position:fixed;right:24px;bottom:22px;padding:13px 18px;border-radius:10px;background:#244f45;color:white;box-shadow:var(--shadow);z-index:3}.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:780px){.login-wrap{grid-template-columns:1fr}.login-art{display:none}.stats{grid-template-columns:repeat(2,1fr)}.home-grid,.detail-grid{grid-template-columns:1fr}.shell{padding:24px 16px}.top{padding:0 16px}.nav{overflow:auto}.heading{align-items:flex-start;flex-direction:column;gap:12px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.record-picker{flex-wrap:wrap}}
</style></head>
<body>
<section id="login" class="login-wrap"><div class="login-art"><div class="brand"><div class="mark">R</div><span>Richmond Area family Therapy</span></div><div><div class="eyebrow">A thoughtful place to begin</div><h1>Care starts with a warm welcome.</h1><p>Front desk workspace for the people and appointments that make up RAFT.</p></div><small class="muted">RAFT · Richmond, Virginia</small></div><div class="login-card-wrap"><form id="loginForm" class="login-card"><div class="eyebrow">Staff access</div><h2>Welcome back</h2><p class="muted">Sign in with your RAFT account.</p><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required placeholder="you@raft.org"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button class="btn" type="submit">Sign in</button><div id="loginError"></div></form></div></section>
<div id="app" class="app hidden"><header class="top"><div class="brand"><div class="mark">R</div><span>RAFT <span class="muted">/ Front desk</span></span></div><div class="topright"><span class="badge" id="roleBadge"></span><button class="btn ghost small" id="signout">Sign out ↗</button></div></header><main class="shell"><nav class="nav" id="nav"></nav><div id="screen"><div class="loading">Loading workspace…</div></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (!window.supabase || !window.supabase.createClient) { $('loginError').innerHTML='<div class="error">RAFT sign-in could not start because the Supabase client library did not load. Check your internet connection or allow cdn.jsdelivr.net, then reload this page.</div>'; } else {
const URL='https://egwvqhnizifllrvdwyak.supabase.co', KEY='sb_publishable_tJe7Gv0SlgYpLDH0z2RStg_5u33OUA3';
const sb=supabase.createClient(URL,KEY,{db:{schema:'raft'}});
const screens=[['home','Home'],['lookup','client lookup'],['dashboard','Dashboard'],['records','Add or edit']];
let session=null, role=null, current='home', selectedClient=null, people=[], clients=[], appts=[], families=[], rooms=[], employees=[], counselors=[];
const full=p=>[p?.firstname,p?.lastname].filter(Boolean).join(' ')||`person ${p?.personid??''}`;
function roleName(){return role==='raft_admin'?'Admin':role==='raft_scheduler'?'Scheduler':'counselor'}
function canManage(){return role==='raft_admin'||role==='raft_scheduler'}
function canSeeWage(){return role==='raft_admin'}
function route(k){current=k;render();}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function fail(e){console.error(e);toast(e?.message||'Could not complete that request.')}
function nav(){ $('nav').innerHTML=screens.map(([id,n])=>`<button class="${current===id?'active':''}" data-route="${id}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>route(b.dataset.route)); }
async function loadBase(){
 // Column lists are explicit and are safe for all roles. wage is only requested by Admin.
 const p=await sb.from('person').select('personid,firstname,lastname,address,city,state,zip,phone,email').order('lastname'); if(p.error)throw p.error; people=p.data||[];
 const c=await sb.from('client').select('clientid,foundout,remindermethod,referredby').order('clientid');if(c.error)throw c.error;clients=c.data||[];
 const aCols=role==='raft_scheduler'?'appointmentid,appointmenttime,duration,counselorid,employeeid,roomnumber':'appointmentid,appointmenttime,duration,counselorid,employeeid,roomnumber,notes';
 const a=await sb.from('appointment').select(aCols).order('appointmenttime',{ascending:false});if(a.error)throw a.error;appts=a.data||[];
 const f=await sb.from('family').select('familyid,familyname,datefounded').order('familyname');if(f.error)throw f.error;families=f.data||[];
 const [r,e,co]=await Promise.all([sb.from('room').select('roomnumber,roomname').order('roomnumber'),sb.from('employee').select(canSeeWage()?'employeeid,datehired,wage,supervisorid':'employeeid,datehired,supervisorid').order('employeeid'),sb.from('counselor').select('counselorid,degreesuffix').order('counselorid')]);
 for(const x of [r,e,co])if(x.error)throw x.error;rooms=r.data||[];employees=e.data||[];counselors=co.data||[];
}
async function load(){try{await loadBase();$('roleBadge').textContent=roleName();$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();render();}catch(e){fail(e);$('screen').innerHTML=`<div class="card"><h2>Could not load your workspace</h2><p>${esc(e.message)}</p><p class="muted">The signed-in role may not have access to a requested table.</p></div>`}}
function person(id){return people.find(p=>p.personid===id)} function clientPerson(id){return person(id)}
function heading(kicker,title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(title,val,caption){return `<div class="card stat"><div class="eyebrow">${title}</div><div class="value">${val}</div><div class="caption">${caption}</div></div>`}
async function render(){if(!session)return;nav();const root=$('screen');root.innerHTML='<div class="loading">Loading…</div>';try{if(current==='home')await home(root);if(current==='lookup')await lookup(root);if(current==='dashboard')await dashboard(root);if(current==='records')records(root)}catch(e){root.innerHTML=`<div class="card"><h2>Unable to show this screen</h2><p>${esc(e.message)}</p></div>`}}
async function home(root){const latest=appts.find(a=>a.appointmenttime)?.appointmenttime;const latestLabel=latest?new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(new Date(latest)):'—';root.innerHTML=heading(new Intl.DateTimeFormat(undefined,{weekday:'long'}).format(new Date())+' · Front desk','Good to see you, '+esc(person(session.user.id)?.firstname||'team')+'.','Your RAFT workspace is ready.')+`<div class="grid stats">${stat('Clients',clients.length,'client records')}${stat('Appointments',appts.length,'all scheduled appointments')}${stat('Families',families.length,'family records')}${stat('Latest appointment',esc(latestLabel),'most recent date in your records')}</div><div class="grid home-grid"><div class="card"><h2 class="section-title">Your workspace</h2><div class="action-list"><button class="action" data-go="lookup"><span><b>Find a client</b><small>Contact details, appointments and family memberships</small></span><span class="arrow">→</span></button><button class="action" data-go="dashboard"><span><b>View the dashboard</b><small>Current counts from your RAFT database</small></span><span class="arrow">→</span></button><button class="action" data-go="records"><span><b>Add or edit a record</b><small>${canManage()?'Clients and appointments':'Update appointment notes and assignments'}</small></span><span class="arrow">→</span></button></div></div><div class="card"><div class="eyebrow">Signed in as</div><h2 class="section-title" style="margin-top:7px">${roleName()}</h2><p class="muted">Your access is based on your RAFT role. The database enforces which records and fields you can view and change.</p><div class="notice">No record is deleted from this workspace.</div></div></div>`;root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go))}
async function lookup(root){root.innerHTML=heading('Directory','client lookup','Search by a client’s name, email or phone.')+`<div class="card"><div class="row"><div class="searchbar"><label for="clientSearch">Search clients</label><input id="clientSearch" placeholder="Name, email or phone"></div><button class="btn" id="searchBtn">Search</button></div><div class="results" id="clientResults"></div></div><div id="clientDetail"></div>`;const search=()=>{const q=$('clientSearch').value.toLowerCase().trim();const list=clients.filter(c=>{const p=clientPerson(c.clientid);return !q||[full(p),p?.email,p?.phone].some(x=>String(x||'').toLowerCase().includes(q))});$('clientResults').innerHTML=list.length?`<div class="table-wrap"><table class="table"><thead><tr><th>client</th><th>email</th><th>phone</th><th></th></tr></thead><tbody>${list.slice(0,30).map(c=>{const p=clientPerson(c.clientid);return `<tr><td class="person-name">${esc(full(p))}</td><td>${esc(p?.email||'—')}</td><td>${esc(p?.phone||'—')}</td><td><button class="btn ghost small" data-client="${c.clientid}">View</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No matching clients.</div>'; $('clientResults').querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>showClient(Number(b.dataset.client)))};$('searchBtn').onclick=search;$('clientSearch').oninput=search;search();async function showClient(id){selectedClient=id;const p=clientPerson(id), c=clients.find(x=>x.clientid===id);const ids=appts.map(a=>a.appointmentid);let sched=[],membership=[],roles=[];if(ids.length){const res=await sb.from('scheduledfor').select(role==='raft_scheduler'?'appointmentid,clientid,kept':'appointmentid,clientid,assignment,kept').eq('clientid',id);if(res.error)throw res.error;sched=res.data||[]}const m=await sb.from('member_in_family').select('familyid,memberid,datejoined').eq('memberid',id);if(m.error)throw m.error;membership=m.data||[];if(membership.length){const ro=await sb.from('member_role').select('familyid,memberid,roleid').eq('memberid',id);if(ro.error)throw ro.error;roles=ro.data||[]}const names={};if(roles.length){const rr=await sb.from('role').select('roleid,rolename').in('roleid',roles.map(x=>x.roleid));if(rr.error)throw rr.error;for(const r of rr.data||[])names[r.roleid]=r.rolename}const familyRows=membership.map(m=>{const f=families.find(x=>x.familyid===m.familyid);const rs=roles.filter(x=>x.familyid===m.familyid).map(x=>names[x.roleid]).filter(Boolean);return `<tr><td>${esc(f?.familyname||`family ${m.familyid}`)}</td><td>${esc(rs.join(', ')||'—')}</td><td>${esc(m.datejoined||'—')}</td></tr>`}).join('');const apRows=sched.map(s=>{const a=appts.find(x=>x.appointmentid===s.appointmentid);return a?`<tr><td>${esc(a.appointmenttime||'—')}</td><td>${esc(a.duration??'—')} min</td><td>${esc(person(a.counselorid)?full(person(a.counselorid)):`${a.counselorid}`)}</td><td>${s.kept===null?'—':s.kept?'kept':'Not kept'}</td>${role==='raft_scheduler'?'':`<td>${esc(s.assignment||'—')}</td><td>${esc(a.notes||'—')}</td>`}</tr>`:''}).join('');$('clientDetail').innerHTML=`<div class="grid detail-grid"><section class="card"><div class="eyebrow">client ${id}</div><h2 class="section-title" style="margin-top:5px">${esc(full(p))}</h2><div class="detail-line"><span>email</span>${esc(p?.email||'—')}</div><div class="detail-line"><span>phone</span>${esc(p?.phone||'—')}</div><div class="detail-line"><span>address</span>${esc([p?.address,p?.city,p?.state,p?.zip].filter(Boolean).join(', ')||'—')}</div><div class="detail-line"><span>Reminder</span>${esc(c?.remindermethod||'—')}</div><div class="detail-line"><span>Found out</span>${esc(c?.foundout||'—')}</div></section><section class="card"><h2 class="section-title">Families</h2>${familyRows?`<table class="table"><thead><tr><th>family</th><th>role</th><th>Joined</th></tr></thead><tbody>${familyRows}</tbody></table>`:'<div class="empty">No family memberships recorded.</div>'}</section><section class="card" style="grid-column:1/-1"><h2 class="section-title">Appointments</h2>${apRows?`<div class="table-wrap"><table class="table"><thead><tr><th>Date and time</th><th>Length</th><th>counselor</th><th>Attendance</th>${role==='raft_scheduler'?'':'<th>assignment</th><th>notes</th>'}</tr></thead><tbody>${apRows}</tbody></table></div>`:'<div class="empty">No appointments recorded for this client.</div>'}</section></div>`}}
async function dashboard(root){const [sch,fm,roles,roomsQ]=await Promise.all([sb.from('scheduledfor').select('appointmentid,clientid,kept'),sb.from('member_in_family').select('familyid,memberid,datejoined'),sb.from('role').select('roleid,rolename'),sb.from('room').select('roomnumber,roomname')]);for(const x of [sch,fm,roles,roomsQ])if(x.error)throw x.error;const attendees=sch.data||[],members=fm.data||[];const kept=attendees.filter(x=>x.kept===true).length;const upcoming=appts.filter(x=>x.appointmenttime&&new Date(x.appointmenttime)>=new Date()).length;const roleMap=new Map((roles.data||[]).map(x=>[x.roleid,x.rolename]));let counts={};for(const m of members){const found=await sb.from('member_role').select('familyid,memberid,roleid').eq('familyid',m.familyid).eq('memberid',m.memberid);if(found.error)throw found.error;for(const r of found.data||[]){const n=roleMap.get(r.roleid)||'Other';counts[n]=(counts[n]||0)+1}}root.innerHTML=heading('At a glance','RAFT dashboard','Counts calculated from your current database records.')+`<div class="grid stats">${stat('Clients',clients.length,'client records')}${stat('Appointments',appts.length,'appointment records')}${stat('Upcoming',upcoming,'appointments from now forward')}${stat('Families',families.length,'family records')}</div><div class="grid home-grid"><section class="card"><h2 class="section-title">appointment activity</h2><div class="detail-line"><span>client bookings</span>${attendees.length}</div><div class="detail-line"><span>Marked kept</span>${kept}</div><div class="detail-line"><span>kept rate</span>${attendees.length?Math.round(kept/attendees.length*100)+'%':'—'}</div><div class="detail-line"><span>Rooms</span>${(roomsQ.data||[]).length}</div><p class="footer-note">Attendance is based on scheduledfor.kept and includes only records with a true value.</p></section><section class="card"><h2 class="section-title">family roles</h2>${Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<div class="detail-line"><span>${esc(k)}</span>${v}</div>`).join(''):'<div class="empty">No family roles recorded.</div>'}<p class="footer-note">Counts represent recorded family role memberships.</p></section></div>${canSeeWage()?`<section class="card" style="margin-top:16px"><h2 class="section-title">Employees</h2><div class="table-wrap"><table class="table"><thead><tr><th>employee</th><th>Date hired</th><th>Supervisor</th><th>wage</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${esc(full(person(e.employeeid)))}</td><td>${esc(e.datehired||'—')}</td><td>${esc(full(person(e.supervisorid)))}</td><td>${e.wage==null?'—':`$${Number(e.wage).toFixed(2)}`}</td></tr>`).join('')}</tbody></table></div></section>`:''}` }
function records(root){const counselor=role==='raft_counselor';root.innerHTML=heading('Records',counselor?'appointment notes':'Add or edit a record',counselor?'Update the clinical fields you are allowed to maintain.':'Create a client or appointment, or edit an existing record.')+`<div class="card"><div class="record-picker">${counselor?'<button class="btn small" data-kind="clinical">appointment notes</button>':`<button class="btn small" data-kind="client">client</button><button class="btn ghost small" data-kind="appointment">appointment</button><button class="btn ghost small" data-kind="room">room</button><button class="btn ghost small" data-kind="edit">Edit existing</button>`}</div><div id="recordForm"><div class="notice">Choose a record type above to begin.</div></div></div>`;root.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>recordForm(b.dataset.kind))}
async function recordForm(kind,editId){const host=$('recordForm');const editing=kind==='edit';if(editing){host.innerHTML=`<label>Record type</label><select id="editType"><option value="client">client</option><option value="appointment">appointment</option><option value="room">room</option></select><label>Choose record</label><select id="editId"><option value="">Select…</option>${clients.map(c=>`<option value="c${c.clientid}">client · ${esc(full(person(c.clientid)))}</option>`).join('')}${appts.map(a=>`<option value="a${a.appointmentid}">appointment · ${esc(a.appointmenttime||a.appointmentid)}</option>`).join('')}${rooms.map(r=>`<option value="r${r.roomnumber}">room · ${esc(r.roomname||r.roomnumber)}</option>`).join('')}</select><div id="editHost"></div>`;$('editId').onchange=()=>{const v=$('editId').value;if(v){recordForm(v[0]==='c'?'client':v[0]==='r'?'room':'appointment',v.slice(1))}};return}
if(kind==='clinical'){host.innerHTML=`<form id="clinicalForm"><label>appointment</label><select name="appointment" required><option value="">Select…</option>${appts.map(a=>`<option value="${a.appointmentid}">${esc(a.appointmenttime||'appointment')} · #${a.appointmentid}</option>`).join('')}</select><label>client</label><select name="client" required><option value="">Select…</option>${clients.map(c=>`<option value="${c.clientid}">${esc(full(person(c.clientid)))}</option>`).join('')}</select><label>appointment notes</label><textarea name="notes" maxlength="3000" placeholder="Add a clinical note"></textarea><label>client assignment</label><textarea name="assignment" maxlength="2000" placeholder="Update the assignment"></textarea><label>Attendance</label><select name="kept"><option value="">No change</option><option value="true">kept</option><option value="false">Not kept</option></select><button class="btn" style="margin-top:18px">Save permitted changes</button></form><p class="footer-note">Only appointment notes and this client’s assignment and attendance are updated.</p>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget),aid=Number(d.get('appointment')),cid=Number(d.get('client'));try{if(d.get('notes')){const x=await sb.from('appointment').update({notes:d.get('notes')}).eq('appointmentid',aid);if(x.error)throw x.error}const patch={};if(d.get('assignment'))patch.assignment=d.get('assignment');if(d.get('kept')!=='')patch.kept=d.get('kept')==='true';if(Object.keys(patch).length){const x=await sb.from('scheduledfor').update(patch).eq('appointmentid',aid).eq('clientid',cid);if(x.error)throw x.error}toast('appointment fields saved.');await load()}catch(e){fail(e)}};return}
if(kind==='room'){host.innerHTML=`<div class="eyebrow">New room</div><form id="roomForm"><label>Room number</label><input name="number" type="number" required><label>Room name</label><input name="name" maxlength="50"><button class="btn" style="margin-top:18px">Add room</button></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const x=await sb.from('room').insert({roomnumber:Number(d.get('number')),roomname:d.get('name')||null});if(x.error)throw x.error;toast('Room added.');await load()}catch(e){fail(e)}};return}if(kind==='client'){host.innerHTML=`<div class="eyebrow">New client</div><form id="clientForm" class="grid form-grid"><div><label>First name</label><input name="first" maxlength="50"></div><div><label>Last name</label><input name="last" maxlength="50"></div><div class="wide"><label>email</label><input name="email" type="email" maxlength="100"></div><div><label>phone</label><input name="phone" maxlength="14"></div><div><label>Reminder method</label><input name="reminder" maxlength="50"></div><div><label>address</label><input name="address" maxlength="50"></div><div><label>city</label><input name="city" maxlength="50"></div><div><label>state</label><input name="state" maxlength="2"></div><div><label>zip</label><input name="zip" maxlength="10"></div><div><label>Found out</label><input name="found" maxlength="50"></div><div><label>Referred by client (optional)</label><select name="ref"><option value="">None</option>${clients.map(c=>`<option value="${c.clientid}">${esc(full(person(c.clientid)))}</option>`).join('')}</select></div><div class="wide"><button class="btn">Add client</button></div></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const payload={firstname:d.get('first')||null,lastname:d.get('last')||null,email:d.get('email')||null,phone:d.get('phone')||null,address:d.get('address')||null,city:d.get('city')||null,state:d.get('state')||null,zip:d.get('zip')||null};const p=await sb.from('person').insert(payload).select('personid').single();if(p.error)throw p.error;const c=await sb.from('client').insert({clientid:p.data.personid,foundout:d.get('found')||null,remindermethod:d.get('reminder')||null,referredby:d.get('ref')?Number(d.get('ref')):null});if(c.error)throw c.error;toast('client added.');await load();route('lookup')}catch(e){fail(e)}};return}
if(kind==='appointment'){host.innerHTML=`<div class="eyebrow">New appointment</div><form id="appointmentForm" class="grid form-grid"><div class="wide"><label>Date and time</label><input name="time" type="datetime-local" required></div><div><label>duration (minutes)</label><input name="duration" type="number" min="1" required></div><div><label>room</label><select name="room" required><option value="">Select…</option>${rooms.map(r=>`<option value="${r.roomnumber}">${esc(r.roomname||'room')} · ${r.roomnumber}</option>`).join('')}</select></div><div><label>counselor</label><select name="counselor" required><option value="">Select…</option>${counselors.map(c=>`<option value="${c.counselorid}">${esc(full(person(c.counselorid)))}</option>`).join('')}</select></div><div><label>Scheduled by</label><select name="employee" required><option value="">Select…</option>${employees.map(e=>`<option value="${e.employeeid}">${esc(full(person(e.employeeid)))}</option>`).join('')}</select></div><div class="wide"><label>client</label><select name="client" required><option value="">Select…</option>${clients.map(c=>`<option value="${c.clientid}">${esc(full(person(c.clientid)))}</option>`).join('')}</select></div>${role==='raft_admin'?'<div class="wide"><label>notes</label><textarea name="notes" maxlength="3000"></textarea></div>':''}<div class="wide"><button class="btn">Add appointment</button></div></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const payload={appointmenttime:new Date(d.get('time')).toISOString(),duration:Number(d.get('duration')),roomnumber:Number(d.get('room')),counselorid:Number(d.get('counselor')),employeeid:Number(d.get('employee'))};if(role==='raft_admin')payload.notes=d.get('notes')||null;const a=await sb.from('appointment').insert(payload).select('appointmentid').single();if(a.error)throw a.error;const sf=await sb.from('scheduledfor').insert({appointmentid:a.data.appointmentid,clientid:Number(d.get('client'))});if(sf.error)throw sf.error;toast('appointment added.');await load()}catch(e){fail(e)}};return}
if(editId){const numeric=Number(editId);if(kind==='client'){const c=clients.find(x=>x.clientid===numeric),p=person(numeric);host.innerHTML=`<div class="eyebrow">Edit client · ${numeric}</div><form id="clientEdit" class="grid form-grid"><div><label>First name</label><input name="first" value="${esc(p?.firstname)}" maxlength="50"></div><div><label>Last name</label><input name="last" value="${esc(p?.lastname)}" maxlength="50"></div><div class="wide"><label>email</label><input name="email" value="${esc(p?.email)}" maxlength="100"></div><div><label>phone</label><input name="phone" value="${esc(p?.phone)}" maxlength="14"></div><div><label>Reminder method</label><input name="reminder" value="${esc(c?.remindermethod)}" maxlength="50"></div><div><label>address</label><input name="address" value="${esc(p?.address)}" maxlength="50"></div><div><label>city</label><input name="city" value="${esc(p?.city)}" maxlength="50"></div><div><label>state</label><input name="state" value="${esc(p?.state)}" maxlength="2"></div><div><label>zip</label><input name="zip" value="${esc(p?.zip)}" maxlength="10"></div><div><label>Found out</label><input name="found" value="${esc(c?.foundout)}" maxlength="50"></div><div><label>Referred by</label><select name="ref"><option value="">None</option>${clients.filter(x=>x.clientid!==numeric).map(x=>`<option value="${x.clientid}" ${x.clientid===c?.referredby?'selected':''}>${esc(full(person(x.clientid)))}</option>`).join('')}</select></div><div class="wide"><button class="btn">Save client</button></div></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const x=await sb.from('person').update({firstname:d.get('first')||null,lastname:d.get('last')||null,email:d.get('email')||null,phone:d.get('phone')||null,address:d.get('address')||null,city:d.get('city')||null,state:d.get('state')||null,zip:d.get('zip')||null}).eq('personid',numeric);if(x.error)throw x.error;const y=await sb.from('client').update({foundout:d.get('found')||null,remindermethod:d.get('reminder')||null,referredby:d.get('ref')?Number(d.get('ref')):null}).eq('clientid',numeric);if(y.error)throw y.error;toast('client updated.');await load()}catch(e){fail(e)}};return}
if(kind==='room'){const r=rooms.find(x=>x.roomnumber===numeric);if(!r){host.innerHTML='<p class="empty">Room not found.</p>';return}host.innerHTML=`<div class="eyebrow">Edit room · ${numeric}</div><form id="roomEdit"><label>Room number</label><input value="${r.roomnumber}" disabled><label>Room name</label><input name="name" maxlength="50" value="${esc(r.roomname)}"><button class="btn" style="margin-top:18px">Save room</button></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const x=await sb.from('room').update({roomname:d.get('name')||null}).eq('roomnumber',numeric);if(x.error)throw x.error;toast('Room updated.');await load()}catch(e){fail(e)}};return}if(kind==='appointment'){const a=appts.find(x=>x.appointmentid===numeric);if(!a){host.innerHTML='<p class="empty">appointment not found.</p>';return}const assigned=(await sb.from('scheduledfor').select(role==='raft_scheduler'?'appointmentid,clientid,kept':'appointmentid,clientid,assignment,kept').eq('appointmentid',numeric));if(assigned.error){host.innerHTML=`<p>${esc(assigned.error.message)}</p>`;return}const row=assigned.data?.[0];host.innerHTML=`<div class="eyebrow">Edit appointment · ${numeric}</div><form id="apptEdit" class="grid form-grid"><div class="wide"><label>Date and time</label><input name="time" type="datetime-local" value="${a.appointmenttime?esc(new Date(a.appointmenttime).toISOString().slice(0,16)):''}" required></div><div><label>duration</label><input name="duration" type="number" value="${a.duration??''}" required></div><div><label>room</label><select name="room">${rooms.map(r=>`<option value="${r.roomnumber}" ${r.roomnumber===a.roomnumber?'selected':''}>${esc(r.roomname||'room')} · ${r.roomnumber}</option>`).join('')}</select></div><div><label>counselor</label><select name="counselor">${counselors.map(c=>`<option value="${c.counselorid}" ${c.counselorid===a.counselorid?'selected':''}>${esc(full(person(c.counselorid)))}</option>`).join('')}</select></div><div><label>Scheduled by</label><select name="employee">${employees.map(e=>`<option value="${e.employeeid}" ${e.employeeid===a.employeeid?'selected':''}>${esc(full(person(e.employeeid)))}</option>`).join('')}</select></div><div><label>client</label><input value="${esc(full(person(row?.clientid))) }" disabled></div>${role==='raft_admin'?`<div class="wide"><label>notes</label><textarea name="notes" maxlength="3000">${esc(a.notes)}</textarea></div>`:''}<div class="wide"><button class="btn">Save appointment</button></div></form>`;host.querySelector('form').onsubmit=async ev=>{ev.preventDefault();const d=new FormData(ev.currentTarget);try{const patch={appointmenttime:new Date(d.get('time')).toISOString(),duration:Number(d.get('duration')),roomnumber:Number(d.get('room')),counselorid:Number(d.get('counselor')),employeeid:Number(d.get('employee'))};if(role==='raft_admin')patch.notes=d.get('notes')||null;const x=await sb.from('appointment').update(patch).eq('appointmentid',numeric);if(x.error)throw x.error;const cid=Number(d.get('client'));if(row&&cid!==row.clientid){throw new Error('The existing client booking cannot be replaced here because records cannot be deleted. Keep the current client selected.')}toast('appointment updated.');await load()}catch(e){fail(e)}}}}
}
async function start(s){session=s;const claims=decode(s.access_token);role=claims.role||claims.app_metadata?.role||claims.user_role;if(!['raft_admin','raft_scheduler','raft_counselor'].includes(role)){session=null;$('loginError').innerHTML='<div class="error">Your account does not have a recognized RAFT role claim.</div>';await sb.auth.signOut();return}await load()}
function decode(token){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return {}}}
$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginError').innerHTML='';const btn=ev.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';$('loginError').innerHTML='<div class="notice">Checking your RAFT account…</div>';try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await start(data.session)}catch(e){$('loginError').innerHTML=`<div class="error">${/invalid login credentials/i.test(e.message)?'That email or password is incorrect.':esc(e.message)}</div>`}finally{btn.disabled=false;btn.textContent='Sign in'}};
$('signout').onclick=async()=>{await sb.auth.signOut();session=null;role=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';$('loginError').innerHTML=''};
sb.auth.onAuthStateChange((_event,s)=>{if(s&&!session)start(s);else if(!s&&session){session=null;role=null;$('app').classList.add('hidden');$('login').classList.remove('hidden')}});
sb.auth.getSession().then(({data,error})=>{if(error){$('loginError').innerHTML=`<div class="error">${esc(error.message)}</div>`;return}if(data.session)start(data.session)});
}
</script></body></html>
